name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Rule selection lives in pyproject.toml so the result does not drift
      # when CI resolves `pip install ruff` to a newer default rule set.
      - run: ruff check backend/
      - run: ruff check benchmark/ benchmark/independent_eval/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install mypy
      - name: Run mypy
        run: python -m mypy backend/app/shield/ --ignore-missing-imports --no-error-summary

  benchmark:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Benchmark smoke test
        run: python benchmark/evaluate.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t agentshield-v3:latest .
      - name: Smoke test Docker image
        run: |
          docker run -d --name agentshield-test -p 8011:8011 agentshield-v3:latest
          # Retry rather than a fixed sleep: a cold Python image plus pip
          # install can take longer than 3s to bind the port, which is what
          # made this step flaky.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8011/health; then
              echo "health OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs agentshield-test
          exit 1
      - name: Collect container logs on failure
        if: failure()
        run: docker logs agentshield-test || true
      - name: Stop container
        if: always()
        run: docker stop agentshield-test || true
